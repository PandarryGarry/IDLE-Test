<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>html,body,#root{margin:0;min-height:100%;background:#2a1508;}</style>
    <title>Aethelia — Idle RPG</title>
    <meta name="description" content="Aethelia — браузерная idle RPG о ремёслах, героях и приключениях." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Aethelia — Idle RPG" />
    <meta property="og:description" content="Ремёсла, герои и приключения в мире Aethelia." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aethelia — Idle RPG" />
    <meta name="twitter:description" content="Ремёсла, герои и приключения в мире Aethelia." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Предзагрузка заставочного арта: стартует ДО исполнения JS-бандла.
         Логика выбора варианта дублирует pickSplashArt() из artRegistry.ts. -->
    <script>
      (function () {
        var a = window.innerWidth / Math.max(1, window.innerHeight);
        var v = a >= 1.15 ? 'wide' : a <= 0.85 ? 'tall' : 'square';
        var preload = function (href) {
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.href = href;
          document.head.appendChild(link);
        };
        preload('/assets/art/intro_sign.webp');
        preload('/assets/art/splash_' + v + '.webp');
        // Входная сцена идёт сразу после заставки у незалогиненного игрока.
        preload('/assets/art/cutscene_tavern_entrance.webp');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
