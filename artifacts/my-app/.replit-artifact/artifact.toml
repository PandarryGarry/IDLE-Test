kind = "web"
previewPath = "/"
title = "Aethelia Idle RPG"
description = "A responsive idle RPG with skill progression, combat, inventory, banking, offline progress, and local save management."
version = "1.0.0"
id = "artifacts/my-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 8080

[services.development]
run = "pnpm --filter @workspace/my-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/my-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/my-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "8080"
BASE_PATH = "/"
