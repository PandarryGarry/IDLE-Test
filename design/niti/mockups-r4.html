<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aethelia · Нити · раунд 4 · 20 нитей</title>
<style>
:root{
  --bg:#0e0b12; --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.07);
  --edge:rgba(232,176,75,.28); --edge-soft:rgba(255,255,255,.10);
  --gold:#e8b04b; --gold-hi:#ffd98a; --arcane:#59e0c8;
  --text:#f4ecdd; --muted:#9a91a6; --dim:#6d6579; --track:rgba(255,255,255,.08);
  --mono:'JetBrains Mono','DejaVu Sans Mono',monospace;
  --disp:'Cinzel','DejaVu Serif',Georgia,serif;
  --sans:'Inter',-apple-system,'DejaVu Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 700px at 50% -10%,#241a33 0%,var(--bg) 60%);color:var(--text);
  font-family:var(--sans);padding:36px 20px 80px;display:flex;flex-direction:column;align-items:center;gap:56px}
.sheet-label{width:390px;text-align:left}
.sheet-label h2{font-family:var(--disp);font-size:20px;letter-spacing:.07em;color:var(--gold-hi);text-transform:uppercase}
.sheet-label p{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.sheet-label .tag{display:inline-block;margin-top:8px;padding:3px 10px;border:1px solid var(--edge);border-radius:999px;color:var(--gold);font-family:var(--mono);font-size:10.5px}
.vwrap{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
body.grid4{flex-direction:row;flex-wrap:nowrap;gap:40px;align-items:flex-start;padding:28px}
body.grid4 .sheet-label h2{font-size:17px}
.svg-mono{font-family:var(--mono);font-weight:700}
.svg-disp{font-family:var(--disp);font-weight:700}
.phone{width:390px;border-radius:28px;overflow:hidden;padding:12px 12px 18px;
  background:linear-gradient(180deg,#171122 0%,#0e0b12 55%,#0b0810 100%);
  border:1px solid rgba(255,255,255,.08);box-shadow:0 30px 80px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.06)}
.hh{display:grid;gap:10px}
.hdr{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--glass);border:1px solid var(--edge-soft)}
.hdr .av{width:44px;height:44px;border-radius:14px;flex:none;background:linear-gradient(145deg,#2b2140,#171122);border:1px solid var(--edge);display:grid;place-items:center;box-shadow:0 0 18px rgba(232,176,75,.25)}
.hdr .av img{width:30px;height:30px;object-fit:contain}
.hdr .id{flex:1;min-width:0}
.hdr .nm{display:flex;align-items:center;gap:7px}
.hdr .nm b{font-family:var(--disp);font-size:15px;letter-spacing:.03em}
.hdr .lv{font-family:var(--mono);font-size:11px;color:var(--gold-hi);border:1px solid var(--edge);border-radius:6px;padding:1px 6px}
.hdr .chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.hdr .pts{display:flex;gap:6px;flex:none}
.hdr .pt{min-width:30px;height:30px;padding:0 6px;border-radius:9px;background:var(--glass2);border:1px solid var(--edge-soft);display:grid;place-items:center}
.hdr .pt b{font-family:var(--mono);font-size:12px;color:var(--gold)}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tabs button{min-height:30px;border-radius:10px;border:1px solid var(--edge-soft);background:transparent;color:var(--muted);
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.tabs button.on{color:#1a1206;background:linear-gradient(140deg,var(--gold-hi),var(--gold));border-color:transparent;box-shadow:0 0 22px rgba(232,176,75,.45)}
.panel{position:relative;padding:12px;padding-top:34px;border-radius:18px;background:var(--glass);border:1px solid var(--edge-soft)}
.panel .i{position:absolute;top:9px;right:10px;width:20px;height:20px;border-radius:7px;border:1px solid var(--edge-soft);color:var(--muted);font-family:var(--mono);font-size:11px;display:grid;place-items:center}
.pane-title{position:absolute;top:11px;left:13px;display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.pane-title img{width:14px;height:14px;filter:drop-shadow(0 0 6px rgba(232,176,75,.6))}
.bar{display:block;height:4px;border-radius:999px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--gold-hi));box-shadow:0 0 8px rgba(232,176,75,.55)}
.bar i.lack{background:linear-gradient(90deg,#4a4358,#6d6579);box-shadow:none}
.gem{width:9px;height:9px;transform:rotate(45deg);border-radius:2px;flex:none}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.card{border-radius:14px;background:rgba(0,0,0,.30);border:1px solid var(--edge-soft)}
.mono-t{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase}
</style>
</head>
<body>
<div id="root"></div>
<script>
const IC = p => '../../artifacts/my-app/public/assets/icons/' + p + '.webp';
const P = {
  fortitude:{ru:'Стойкость', short:'СТОЙ', icon:IC('stats/stat_defense'), c:'#6ea8ff', val:62},
  might:    {ru:'Мощь',      short:'МОЩЬ', icon:IC('stats/stat_strength'), c:'#ff7a6b', val:41},
  finesse:  {ru:'Сноровка',  short:'СНОР', icon:IC('stats/stat_agility'),  c:'#4fe0b0', val:44},
  instinct: {ru:'Чутьё',     short:'ЧУТЬ', icon:IC('stats/stat_luck'),     c:'#c792ff', val:33},
};
const REQ = { 1:[40,25], 2:[70,40], 3:[95,60], 4:[120,80] };
const TIER_C = { 1:'#8b93a5', 2:'#e8b04b', 3:'#c792ff', 4:'#59e0c8' };
const mk=(id,ru,a,b,tier,icon,soon)=>({id,ru,a,b,tier,icon,soon:!!soon});
/* 20 нитей: 6 пар столпов x ярусы I-IV */
const T = [
  mk('fm1','Крепкий удар','fortitude','might',1,IC('skills/skill_sword_strike')),
  mk('fm2','Стена мышц','fortitude','might',2,IC('skills/skill_shield_block')||IC('skills/skill_heal')),
  mk('fm3','Гнев горна','fortitude','might',3,IC('skills/skill_ultimate'),1),
  mk('fm4','Клятва железа','fortitude','might',4,IC('skills/skill_ultimate'),1),
  mk('ms1','Неудержимый','might','finesse',1,IC('skills/skill_crit_strike')),
  mk('ms2','Танец клинка','might','finesse',2,IC('skills/skill_crit_strike')),
  mk('ms3','Вихрь стали','might','finesse',3,IC('skills/skill_sword_strike'),1),
  mk('ms4','Ярость бури','might','finesse',4,IC('skills/skill_ultimate'),1),
  mk('si1','Быстрый глаз','finesse','instinct',1,IC('stats/stat_crit')),
  mk('si2','Око бури','finesse','instinct',2,IC('stats/stat_crit')),
  mk('si3','Тень удачи','finesse','instinct',3,IC('stats/stat_luck'),1),
  mk('fi1','Живучий везунчик','fortitude','instinct',1,IC('skills/skill_heal')),
  mk('fi2','Клятва крови','fortitude','instinct',2,IC('skills/skill_heal')),
  mk('fi3','Сердце корня','fortitude','instinct',3,IC('stats/stat_health')||IC('skills/skill_heal'),1),
  mk('sf1','Мастер темпа','finesse','fortitude',1,IC('stats/stat_speed')),
  mk('sf2','Второй ветер','finesse','fortitude',2,IC('stats/stat_speed')),
  mk('sf3','Дыхание камня','finesse','fortitude',3,IC('stats/stat_defense'),1),
  mk('mi1','Разрушитель','might','instinct',1,IC('skills/skill_ultimate')),
  mk('mi2','Охотник на корон','might','instinct',2,IC('skills/skill_ultimate')),
  mk('mi3','Чуткая мощь','might','instinct',3,IC('stats/stat_strength'),1),
];
T.forEach(t=>{ const [na,nb]=REQ[t.tier]; t.an=na; t.bn=nb;
  t.on = !t.soon && P[t.a].val>=na && P[t.b].val>=nb; });
const PAIRS = [
  {k:'fortitude-might',   a:'fortitude', b:'might'},
  {k:'might-finesse',     a:'might',     b:'finesse'},
  {k:'finesse-instinct',  a:'finesse',   b:'instinct'},
  {k:'fortitude-instinct',a:'fortitude', b:'instinct'},
  {k:'fortitude-finesse', a:'fortitude', b:'finesse'},
  {k:'might-instinct',    a:'might',     b:'instinct'},
];
const pairOf = t => [t.a,t.b].sort().join('-');
const inPair = k => T.filter(t=>pairOf(t)===k);
const BURN = T.filter(t=>t.on).length, SOON = T.filter(t=>t.soon).length, SLEEP = T.length-BURN-SOON;

function chrome(inner,title){
  return `<div class="hh">
    <div class="hdr">
      <span class="av"><img src="${IC('menu/menu_profile')}"></span>
      <span class="id"><span class="nm"><b>Каэль</b><span class="lv">47</span></span><span class="chip">человек</span></span>
      <span class="pts"><span class="pt"><b>3</b></span><span class="pt"><b>1</b></span></span>
    </div>
    <div class="tabs"><button>Тело</button><button>Экип</button><button class="on">Нити</button><button>Путь</button></div>
    <div class="panel"><span class="i">i</span>
      <span class="pane-title"><img src="${IC('skills/skill_lightning')}">${title}</span>
      ${inner}
    </div>
  </div>`;
}
const gem = t => `<span class="gem" style="background:${TIER_C[t.tier]};box-shadow:0 0 8px ${TIER_C[t.tier]}66"></span>`;
const dot = t => `<span class="dot" style="background:${t.on?'var(--gold-hi)':(t.soon?'#3a3348':'#4a4358')};box-shadow:${t.on?'0 0 10px rgba(255,217,138,.9)':'none'}"></span>`;
const tierRoman = {1:'I',2:'II',3:'III',4:'IV'};
/* мини-хорда пары: две звезды + линия */
const pairGlyph = (k,size=46) => {
  const pr = PAIRS.find(x=>x.k===k); const A=P[pr.a], B=P[pr.b];
  return `<svg viewBox="0 0 46 22" width="${size}" height="${size*22/46}" style="flex:none">
    <line x1="6" y1="11" x2="40" y2="11" stroke="#3a3348" stroke-width="1.1"/>
    <circle cx="6" cy="11" r="4.4" fill="#171122" stroke="${A.c}" stroke-width="1.1"/>
    <circle cx="40" cy="11" r="4.4" fill="#171122" stroke="${B.c}" stroke-width="1.1"/>
  </svg>`;
};
function summaryStrip(){
  return `<div class="card" style="display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:10px">
    <svg viewBox="0 0 42 42" width="40" height="40" style="flex:none">
      <circle cx="21" cy="21" r="15" fill="none" stroke="#2b2438" stroke-width="6"/>
      <circle cx="21" cy="21" r="15" fill="none" stroke="url(#dg)" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="${2*Math.PI*15*BURN/T.length} 999" transform="rotate(-90 21 21)"/>
      <circle cx="21" cy="21" r="15" fill="none" stroke="#5b4a7a" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="${2*Math.PI*15*SOON/T.length} 999" transform="rotate(${-90+360*(BURN+SLEEP)/T.length} 21 21)" opacity=".8"/>
      <defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8b04b"/><stop offset="1" stop-color="#ffd98a"/></linearGradient></defs>
      <text x="21" y="25" text-anchor="middle" fill="#ffd98a" class="svg-mono" font-size="11">${BURN}</text>
    </svg>
    <span style="flex:1;min-width:0;display:grid;gap:3px">
      <span class="mono-t" style="color:var(--gold)">гобелен судьбы · ${T.length} нитей</span>
      <span style="display:flex;gap:10px;font-family:var(--mono);font-size:9.5px">
        <span style="color:var(--gold-hi)">✦ горит ${BURN}</span>
        <span style="color:var(--muted)">спит ${SLEEP}</span>
        <span style="color:#c792ff">скоро ${SOON}</span>
      </span>
    </span>
    <span style="display:grid;gap:3px;justify-items:end">
      ${Object.values(P).map(p=>`<span style="display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9px;color:${p.c}"><img src="${p.icon}" style="width:11px;height:11px">${p.val}</span>`).join('')}
    </span>
  </div>`;
}
function threadRow(t, compact){
  const prog = Math.min(1, Math.min(P[t.a].val/t.an, P[t.b].val/t.bn));
  return `<div class="card" style="padding:${compact?'7px 9px':'9px 10px'};display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:9px;align-items:center;${t.on?'border-color:var(--edge);background:rgba(232,176,75,.06);':''}">
    <img src="${t.icon}" style="width:${compact?18:20}px;height:${compact?18:20}px;${t.on||t.soon?'':'opacity:.6'}">
    <span style="min-width:0;display:grid;gap:4px">
      <span style="display:flex;align-items:center;gap:6px;min-width:0">
        <b style="flex:1;min-width:0;font-family:var(--disp);font-size:${compact?11.5:12.5}px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.ru}</b>
        <span class="mono-t" style="color:${TIER_C[t.tier]}">${tierRoman[t.tier]}</span>
      </span>
      <span style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center">
        <span class="bar"><i class="${t.on?'':'lack'}" style="width:${prog*100}%"></i></span>
        <span style="font-family:var(--mono);font-size:9px;color:${t.on?'var(--gold-hi)':(t.soon?'#c792ff':'var(--dim)')}">${t.on?'готова':(t.soon?'скоро':Math.floor(prog*100)+'%')}</span>
      </span>
    </span>
    ${dot(t)}
  </div>`;
}

/* ═══ R4-A · АТЛАС: агрегированные канаты пар + раскрытая пара ═══ */
function variantA(){
  const POS={fortitude:[170,44],might:[288,153],finesse:[170,262],instinct:[52,153]};
  const C={x:170,y:153};
  let ropes='';
  PAIRS.forEach((pr,i)=>{
    const list=inPair(pr.k); const burn=list.filter(t=>t.on).length;
    const [x1,y1]=POS[pr.a],[x2,y2]=POS[pr.b];
    const mx=(x1+x2)/2,my=(y1+y2)/2;
    const t=0.40+(i%2)*0.18;
    const cx=mx+(C.x-mx)*t, cy=my+(C.y-my)*t;
    const d=`M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`;
    const open = pr.k==='fortitude-might';
    if(burn>0) ropes+=`<path d="${d}" fill="none" stroke="#ffd98a" stroke-width="7" opacity=".22" filter="url(#bl)"/>`;
    ropes+=`<path d="${d}" fill="none" stroke="${open?'url(#gld)':(burn>0?'#8a6a2a':'#3a3348')}" stroke-width="${open?7:5}" stroke-linecap="round" opacity="${open?1:.9}"/>`;
    ropes+=`<g transform="translate(${0.25*x1+0.5*cx+0.25*x2},${0.25*y1+0.5*cy+0.25*y2})">
      <rect x="-21" y="-9" width="42" height="18" rx="9" fill="#171122" stroke="${open?'var(--gold-hi)':(burn>0?'var(--gold)':'#3a3348')}" stroke-width="${open?1.4:1}"/>
      <text y="4" text-anchor="middle" fill="${burn>0?'#ffd98a':'var(--dim)'}" class="svg-mono" font-size="9">${list.length} · ${burn}✦</text></g>`;
  });
  let stars='';
  const lbl={fortitude:[0,-30],might:[0,-30],finesse:[0,38],instinct:[0,-30]};
  for(const [k,p] of Object.entries(P)){const [x,y]=POS[k];
    stars+=`<g transform="translate(${x},${y})">
      <circle r="24" fill="${p.c}" opacity=".08"/><circle r="24" fill="none" stroke="${p.c}" stroke-width="1" opacity=".4"/>
      <circle r="17" fill="#171122" stroke="${p.c}" stroke-width="1.3"/>
      <image x="-10" y="-10" width="20" height="20" href="${p.icon}"/>
      <text x="${lbl[k][0]}" y="${lbl[k][1]}" text-anchor="middle" fill="${p.c}" class="svg-mono" font-size="9" letter-spacing="1">${p.short} ${p.val}</text></g>`;}
  const openList=inPair('fortitude-might');
  return chrome(`${summaryStrip()}
    <svg viewBox="0 0 340 318" width="100%" style="display:block">
      <defs><filter id="bl" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
      <linearGradient id="gld" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8b04b"/><stop offset="1" stop-color="#ffd98a"/></linearGradient></defs>
      ${[...Array(20)].map((_,i)=>`<circle cx="${(i*67+13)%340}" cy="${(i*113+29)%318}" r="${i%3?0.7:1.2}" fill="#fff" opacity="${0.05+(i%4)*0.04}"/>`).join('')}
      ${ropes}${stars}
    </svg>
    <div class="card" style="margin-top:8px;padding:10px;border-color:var(--edge)">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        ${pairGlyph('fortitude-might',40)}
        <b style="flex:1;font-family:var(--disp);font-size:12.5px">Стойкость ↔ Мощь</b>
        <span class="mono-t" style="color:var(--gold-hi)">${openList.filter(t=>t.on).length} из ${openList.length} горит</span>
      </div>
      <div style="display:grid;gap:6px">${openList.map(t=>threadRow(t,true)).join('')}</div>
    </div>`, 'нити · атлас');
}

/* ═══ R4-B · ПУЛЬТ: донат-статус, фильтры, вьюпорт-сетка 20 плиток ═══ */
function variantB(){
  const tiles = T.map(t=>`
    <div class="card" style="min-width:0;padding:7px;display:grid;gap:5px;justify-items:start;${t.on?'border-color:var(--edge);background:rgba(232,176,75,.07);':''}">
      <span style="display:flex;align-items:center;gap:6px;width:100%">
        <img src="${t.icon}" style="width:18px;height:18px;${t.on||t.soon?'':'opacity:.55'}">
        ${gem(t)}<span style="margin-left:auto">${dot(t)}</span>
      </span>
      <b style="width:100%;min-width:0;font-family:var(--disp);font-size:10.5px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${t.ru}</b>
    </div>`).join('');
  return chrome(`${summaryStrip()}
    <div style="display:flex;gap:6px;margin-bottom:8px">
      ${[['все',T.length],['✦',BURN],['спит',SLEEP],['скоро',SOON]].map(([lab,n],i)=>`
        <button style="flex:1;padding:5px 2px;border-radius:9px;border:1px solid ${i===0?'var(--edge)':'var(--edge-soft)'};background:${i===0?'rgba(232,176,75,.10)':'transparent'};color:${i===0?'var(--gold-hi)':'var(--dim)'};font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase">${lab} · ${n}</button>`).join('')}
    </div>
    <div style="position:relative;border-radius:14px;border:1px solid var(--edge-soft);background:rgba(0,0,0,.22);padding:8px;height:252px;overflow:hidden">
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px">${tiles}</div>
      <div style="position:absolute;left:0;right:0;bottom:0;height:64px;background:linear-gradient(180deg,transparent,#0e0b12 78%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px">
        <span class="mono-t" style="color:var(--gold-hi)">показано 9 из ${T.length} · листай</span>
      </div>
    </div>`, 'нити · пульт');
}

/* ═══ R4-C · КНИГА НИТЕЙ: 6 глав-пар, аккордеон ═══ */
function variantC(){
  const open='fortitude-might';
  const chapters = PAIRS.map(pr=>{
    const list=inPair(pr.k); const burn=list.filter(t=>t.on).length;
    const isOpen = pr.k===open; const A=P[pr.a], B=P[pr.b];
    return `<div class="card" style="overflow:hidden;${isOpen?'border-color:var(--edge);':''}">
      <div style="display:flex;align-items:center;gap:9px;padding:9px 10px;${isOpen?'background:rgba(232,176,75,.06);':''}">
        ${pairGlyph(pr.k,42)}
        <span style="flex:1;min-width:0">
          <b style="display:block;font-family:var(--disp);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${A.ru} ↔ ${B.ru}</b>
          <span style="display:flex;gap:8px;font-family:var(--mono);font-size:9px;color:var(--dim)"><span style="color:${A.c}">${A.short}</span><span style="color:${B.c}">${B.short}</span><span>· ${list.length} нити</span></span>
        </span>
        <span class="mono-t" style="color:${burn>0?'var(--gold-hi)':'var(--dim)'}">${burn}/${list.length} ✦</span>
        <span style="color:${isOpen?'var(--gold-hi)':'var(--dim)'};font-size:11px">${isOpen?'▾':'▸'}</span>
      </div>
      ${isOpen?`<div style="border-top:1px solid var(--edge-soft);padding:8px;display:grid;gap:6px">${list.map(t=>threadRow(t,true)).join('')}</div>`:''}
    </div>`;
  }).join('');
  return chrome(`${summaryStrip()}
    <div style="display:grid;gap:7px">${chapters}</div>`, 'нити · книга');
}

/* ═══ R4-D · МАТРИЦА СУДЬБЫ: строки-пары x колонки-ярусы ═══ */
function variantD(){
  const cols=[1,2,3,4];
  const rows = PAIRS.map(pr=>{
    const list=inPair(pr.k);
    return `<div style="display:grid;grid-template-columns:minmax(0,1.35fr) repeat(4,minmax(0,1fr));gap:6px;align-items:center">
      <span style="display:flex;align-items:center;gap:7px;min-width:0">
        ${pairGlyph(pr.k,38)}
        <span style="min-width:0"><b style="display:block;font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:${P[pr.a].c}">${P[pr.a].short}<span style="color:var(--dim)">↔</span><span style="color:${P[pr.b].c}">${P[pr.b].short}</span></b>
        <span style="font-family:var(--mono);font-size:8.5px;color:var(--dim)">${list.filter(t=>t.on).length}/${list.length} ✦</span></span>
      </span>
      ${cols.map(c=>{
        const t=list.find(x=>x.tier===c);
        if(!t) return `<span style="aspect-ratio:1/1;border:1px dashed #2b2438;border-radius:10px"></span>`;
        return `<span style="aspect-ratio:1/1;border-radius:10px;display:grid;place-items:center;position:relative;
          background:${t.on?'rgba(232,176,75,.10)':'rgba(0,0,0,.30)'};border:1px solid ${t.on?'var(--edge)':(t.soon?'#3a2f4a':'var(--edge-soft)')}">
          <img src="${t.icon}" style="width:18px;height:18px;${t.on?'opacity:1':(t.soon?'opacity:.35':'opacity:.6')}">
          <span style="position:absolute;top:3px;right:4px">${dot(t)}</span>
        </span>`;
      }).join('')}
    </div>`;
  }).join('');
  return chrome(`${summaryStrip()}
    <div style="display:grid;grid-template-columns:minmax(0,1.35fr) repeat(4,minmax(0,1fr));gap:6px;margin-bottom:7px">
      <span class="mono-t" style="color:var(--dim);align-self:end">пара \\ ярус</span>
      ${cols.map(c=>`<span style="text-align:center;font-family:var(--mono);font-size:10px;font-weight:700;color:${TIER_C[c]}">${tierRoman[c]}</span>`).join('')}
    </div>
    <div style="display:grid;gap:7px">${rows}</div>
    <p style="margin-top:9px;font-family:var(--mono);font-size:9px;color:var(--dim);line-height:1.5">пустая клетка = место под будущую нить пары; точка = статус; цвет кромки = ярус. Все ${T.length} нитей учтены.</p>`, 'нити · матрица');
}

const VARIANTS=[
  ['R4-A','Атлас нитей','Уровень 1: шесть агрегированных «канатов» между столпами, на каждом счётчик «всего · горит». Уровень 2: тап по канату раскрывает список нитей пары. Карта никогда не показывает 20 объектов — только 6 агрегатов; списки растут бесконечно.','20 нитей = 6 канатов + списки · без pan/zoom'],
  ['R4-B','Пульт','Донат-статус (горит/спит/скоро) + значения столпов, фильтры-счётчики и вьюпорт-сетка плиток 3×N с фиксированной высотой и добором «показано 9 из 20 · листай». Всё учтено счётчиками; высота экрана не растёт.','20 нитей в вьюпорте фикс-высоты · счётчики фильтров'],
  ['R4-C','Книга нитей','Шесть глав-пар аккордеоном: открыта одна глава со своими нитями, остальные свернуты со счётчиками «1/4 ✦». Порядок стабилен, масштаб = строки внутри глав, экран всегда аккуратен.','20 нитей в 6 главах · открыта одна'],
  ['R4-D','Матрица судьбы','Таблица: строки = 6 пар, колонки = ярусы I-IV. Клетка = нить; пустая пунктирная клетка = учтённое место под будущую нить. Одним кадром виден ВЕСЬ план развития (20 нитей + резерв), статус точкой, ярус цветом кромки.','20 нитей + резерв одним кадром · табличный обзор'],
];
const builders=[variantA,variantB,variantC,variantD];
document.getElementById('root').innerHTML = VARIANTS.map(([letter,name,desc,trade],i)=>`
  <div class="vwrap">
    <div class="sheet-label"><h2>${letter} — ${name}</h2><p>${desc}</p><span class="tag">${trade}</span></div>
    <div class="phone" id="variant-${letter}">${builders[i]()}</div>
  </div>`).join('');
</script>
</body>
</html>
