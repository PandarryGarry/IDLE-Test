<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  body{margin:0;background:#0b0810;display:grid;grid-template-columns:repeat(2,470px);gap:26px;padding:26px;
       font-family:'DejaVu Sans',sans-serif}
  figure{margin:0}
  figcaption{color:#ffd98a;font-size:17px;font-weight:700;letter-spacing:.06em;padding:6px 2px 8px;text-transform:uppercase}
  figcaption small{display:block;color:#9a91a6;font-size:12px;font-weight:400;letter-spacing:0;text-transform:none;margin-top:3px}
  img{width:470px;display:block;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
</style>
</head>
<body>
  <figure><figcaption>A · Созвездие<small>звёздная карта: столпы-светила, нити-лучи, узелки-медальоны</small></figcaption><img src="concept2-A.png"></figure>
  <figure><figcaption>B · Бенто-чипы<small>featured-карточка + сетка чипов, вся информация сразу</small></figcaption><img src="concept2-B.png"></figure>
  <figure><figcaption>C · Лента-таймлайн<small>светящийся рельс, узлы-точки, раскрытие с «не хватает»</small></figcaption><img src="concept2-C.png"></figure>
  <figure><figcaption>D · Орбитальный радар<small>кольца, дуги столпов, нити-спутники со шлейфами, центр-ридаут</small></figcaption><img src="concept2-D.png"></figure>
</body>
</html>
