<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  body{margin:0;background:#0b0810;display:grid;grid-template-columns:repeat(2,470px);gap:26px;padding:26px;
       font-family:'DejaVu Sans',sans-serif}
  figure{margin:0}
  figcaption{color:#ffd98a;font-size:17px;font-weight:700;letter-spacing:.06em;padding:6px 2px 8px;text-transform:uppercase}
  figcaption small{display:block;color:#9a91a6;font-size:12px;font-weight:400;letter-spacing:0;text-transform:none;margin-top:3px}
  img{width:470px;display:block;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
</style>
</head>
<body>
  <figure><figcaption>A1 · Аккорд-небо</figcaption><small style="color:#9a91a6;font-size:12px;display:block;margin:-4px 0 8px">хорды-ленты + фильтр по столпу, без pan/zoom</small><img src="concept3-A1.png"></figure>
  <figure><figcaption>A2 · Небеса-страницы</figcaption><small style="color:#9a91a6;font-size:12px;display:block;margin:-4px 0 8px">пейджер созвездий по ярусам, карта никогда не перегружена</small><img src="concept3-A2.png"></figure>
  <figure><figcaption>A3 · Звёздная лента</figcaption><small style="color:#9a91a6;font-size:12px;display:block;margin:-4px 0 8px">сигил K4 в шапке + feed строк-нитей, масштаб бесконечный</small><img src="concept3-A3.png"></figure>
  <figure><figcaption>A4 · Аккорд + лента</figcaption><small style="color:#9a91a6;font-size:12px;display:block;margin:-4px 0 8px">обзор-хорды сверху + рабочий список с синхронным выбором</small><img src="concept3-A4.png"></figure>
</body>
</html>
