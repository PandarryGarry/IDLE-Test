<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  body{margin:0;background:#120b06;display:grid;grid-template-columns:repeat(2,470px);gap:26px;padding:26px;
       font-family:'DejaVu Sans',sans-serif}
  figure{margin:0}
  figcaption{color:#f0c030;font-size:17px;font-weight:700;letter-spacing:.05em;padding:6px 2px 2px;text-transform:uppercase}
  figure small{display:block;color:#c8a050;font-size:12px;margin:0 0 8px}
  img{width:470px;display:block;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
</style>
</head>
<body>
  <figure><figcaption>Вариант 1 · Плотная сетка 3×N</figcaption><small>максимум карточек, имя в строку, полоса + %</small><img src="pultc-V1.png"></figure>
  <figure><figcaption>Вариант 2 · Карточки 2 колонки</figcaption><small>имя в 2 строки, чип «осталось +N» / «✓ готово»</small><img src="pultc-V2.png"></figure>
  <figure><figcaption>Вариант 3 · Горизонтальные строки</figcaption><small>иконка-плитка, имя + полоса в строку, % и «+N» справа</small><img src="pultc-V3.png"></figure>
  <figure><figcaption>Модалка нити</figcaption><small>что делает + два столпа с прогрессом + осталось повысить</small><img src="pultc-M.png"></figure>
</body>
</html>
