<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aethelia · Нити · доработки варианта A</title>
<style>
:root{
  --bg:#0e0b12; --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.07);
  --edge:rgba(232,176,75,.28); --edge-soft:rgba(255,255,255,.10);
  --gold:#e8b04b; --gold-hi:#ffd98a; --arcane:#59e0c8;
  --text:#f4ecdd; --muted:#9a91a6; --dim:#6d6579; --track:rgba(255,255,255,.08);
  --mono:'JetBrains Mono','DejaVu Sans Mono',monospace;
  --disp:'Cinzel','DejaVu Serif',Georgia,serif;
  --sans:'Inter',-apple-system,'DejaVu Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 700px at 50% -10%,#241a33 0%,var(--bg) 60%);color:var(--text);
  font-family:var(--sans);padding:36px 20px 80px;display:flex;flex-direction:column;align-items:center;gap:56px}
.sheet-label{width:390px;text-align:left}
.sheet-label h2{font-family:var(--disp);font-size:20px;letter-spacing:.07em;color:var(--gold-hi);text-transform:uppercase}
.sheet-label p{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5}
.sheet-label .tag{display:inline-block;margin-top:8px;padding:3px 10px;border:1px solid var(--edge);border-radius:999px;color:var(--gold);font-family:var(--mono);font-size:11px}
.vwrap{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
body.grid4{flex-direction:row;flex-wrap:nowrap;gap:40px;align-items:flex-start;padding:28px}
body.grid4 .sheet-label h2{font-size:17px}
.svg-mono{font-family:var(--mono);font-weight:700}
.svg-disp{font-family:var(--disp);font-weight:700}
.phone{width:390px;border-radius:28px;overflow:hidden;padding:12px 12px 18px;
  background:linear-gradient(180deg,#171122 0%,#0e0b12 55%,#0b0810 100%);
  border:1px solid rgba(255,255,255,.08);box-shadow:0 30px 80px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.06)}
.hh{display:grid;gap:10px}
.hdr{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--glass);border:1px solid var(--edge-soft)}
.hdr .av{width:44px;height:44px;border-radius:14px;flex:none;background:linear-gradient(145deg,#2b2140,#171122);border:1px solid var(--edge);display:grid;place-items:center;box-shadow:0 0 18px rgba(232,176,75,.25)}
.hdr .av img{width:30px;height:30px;object-fit:contain}
.hdr .id{flex:1;min-width:0}
.hdr .nm{display:flex;align-items:center;gap:7px}
.hdr .nm b{font-family:var(--disp);font-size:15px;letter-spacing:.03em}
.hdr .lv{font-family:var(--mono);font-size:11px;color:var(--gold-hi);border:1px solid var(--edge);border-radius:6px;padding:1px 6px}
.hdr .chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.hdr .pts{display:flex;gap:6px;flex:none}
.hdr .pt{min-width:30px;height:30px;padding:0 6px;border-radius:9px;background:var(--glass2);border:1px solid var(--edge-soft);display:grid;place-items:center}
.hdr .pt b{font-family:var(--mono);font-size:12px;color:var(--gold)}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tabs button{min-height:30px;border-radius:10px;border:1px solid var(--edge-soft);background:transparent;color:var(--muted);
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.tabs button.on{color:#1a1206;background:linear-gradient(140deg,var(--gold-hi),var(--gold));border-color:transparent;box-shadow:0 0 22px rgba(232,176,75,.45)}
.panel{position:relative;padding:12px;padding-top:34px;border-radius:18px;background:var(--glass);border:1px solid var(--edge-soft)}
.panel .i{position:absolute;top:9px;right:10px;width:20px;height:20px;border-radius:7px;border:1px solid var(--edge-soft);color:var(--muted);font-family:var(--mono);font-size:11px;display:grid;place-items:center}
.pane-title{position:absolute;top:11px;left:13px;display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.pane-title img{width:14px;height:14px;filter:drop-shadow(0 0 6px rgba(232,176,75,.6))}
.sumbar{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0;
  padding:6px 10px;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid var(--edge-soft);margin-bottom:10px}
.sumbar .t{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;white-space:nowrap}
.sumbar .chips{display:flex;gap:8px;min-width:0}
.sumbar .chips span{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;white-space:nowrap}
.sumbar .chips img{width:12px;height:12px}
.bar{display:block;height:4px;border-radius:999px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--gold-hi));box-shadow:0 0 8px rgba(232,176,75,.55)}
.bar i.lack{background:linear-gradient(90deg,#4a4358,#6d6579);box-shadow:none}
.gem{width:9px;height:9px;transform:rotate(45deg);border-radius:2px;flex:none}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.card{border-radius:14px;background:rgba(0,0,0,.30);border:1px solid var(--edge-soft)}
.fchips{display:flex;gap:6px;margin-bottom:9px}
.fchips button{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;padding:5px 4px;border-radius:9px;
  border:1px solid var(--edge-soft);background:transparent;color:var(--dim);font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.fchips button img{width:12px;height:12px;opacity:.8}
.fchips button.on{color:var(--text);border-color:var(--edge);background:rgba(232,176,75,.10);box-shadow:0 0 14px rgba(232,176,75,.22)}
</style>
</head>
<body>
<div id="root"></div>
<script>
const IC = p => '../../artifacts/my-app/public/assets/icons/' + p + '.webp';
const PILLARS = {
  fortitude:{ru:'Стойкость', short:'СТОЙ', icon:IC('stats/stat_defense'), c:'#6ea8ff', val:62},
  might:    {ru:'Мощь',      short:'МОЩЬ', icon:IC('stats/stat_strength'), c:'#ff7a6b', val:41},
  finesse:  {ru:'Сноровка',  short:'СНОР', icon:IC('stats/stat_agility'),  c:'#4fe0b0', val:44},
  instinct: {ru:'Чутьё',     short:'ЧУТЬ', icon:IC('stats/stat_luck'),     c:'#c792ff', val:33},
};
/* 6 боевых + 4 «скоро» — демонстрация масштаба */
const THREADS = [
  {id:'solid_strike',  ru:'Крепкий удар',     fx:'+10% урона за каждые 100 Стойкости.',             a:'fortitude',an:50,b:'might',bn:30,   icon:IC('skills/skill_sword_strike'), tier:1},
  {id:'unstoppable',   ru:'Неудержимый',      fx:'Каждый пятый удар — двойной.',                    a:'might',an:50,    b:'finesse',bn:30,  icon:IC('skills/skill_crit_strike'),  tier:1},
  {id:'quick_eye',     ru:'Быстрый глаз',     fx:'Криты ускоряют перезарядку на 5%.',               a:'finesse',an:50,  b:'instinct',bn:30, icon:IC('stats/stat_crit'),           tier:1},
  {id:'lucky_survivor',ru:'Живучий везунчик', fx:'При малом здоровье выше шанс крита.',             a:'fortitude',an:50,b:'instinct',bn:30, icon:IC('skills/skill_heal'),         tier:1},
  {id:'tempo_master',  ru:'Мастер темпа',     fx:'Offline-фарм не прерывается элитой.',             a:'finesse',an:70,  b:'fortitude',bn:40,icon:IC('stats/stat_speed'),          tier:2},
  {id:'destroyer',     ru:'Разрушитель',      fx:'Боссы получают +15% урона от критов.',            a:'might',an:70,    b:'instinct',bn:40, icon:IC('skills/skill_ultimate'),     tier:2},
  {id:'forge_wrath',   ru:'Гнев горна',       fx:'Скоро.',                                          a:'might',an:90,    b:'fortitude',bn:60,icon:IC('skills/skill_ultimate'),     tier:3, soon:true},
  {id:'blade_dance',   ru:'Танец клинка',     fx:'Скоро.',                                          a:'finesse',an:90,  b:'might',bn:60,   icon:IC('skills/skill_crit_strike'),  tier:3, soon:true},
  {id:'storm_eye',     ru:'Око бури',         fx:'Скоро.',                                          a:'instinct',an:90, b:'finesse',bn:60, icon:IC('stats/stat_crit'),           tier:3, soon:true},
  {id:'blood_oath',    ru:'Клятва крови',     fx:'Скоро.',                                          a:'fortitude',an:90,b:'instinct',bn:60,icon:IC('skills/skill_heal'),         tier:3, soon:true},
];
THREADS.forEach(t => t.on = !t.soon && PILLARS[t.a].val >= t.an && PILLARS[t.b].val >= t.bn);
const missing = t => [[t.a,t.an],[t.b,t.bn]].filter(([k,n])=>PILLARS[k].val<n).map(([k,n])=>`${PILLARS[k].ru} ${n-PILLARS[k].val}`).join(', ');

function chrome(inner,title){
  return `<div class="hh">
    <div class="hdr">
      <span class="av"><img src="${IC('menu/menu_profile')}"></span>
      <span class="id"><span class="nm"><b>Каэль</b><span class="lv">47</span></span><span class="chip">человек</span></span>
      <span class="pts"><span class="pt"><b>3</b></span><span class="pt"><b>1</b></span></span>
    </div>
    <div class="tabs"><button>Тело</button><button>Экип</button><button class="on">Нити</button><button>Путь</button></div>
    <div class="panel"><span class="i">i</span>
      <span class="pane-title"><img src="${IC('skills/skill_lightning')}">${title}</span>
      ${inner}
    </div>
  </div>`;
}
function sumbar(extra){
  const n=THREADS.filter(t=>t.on).length;
  return `<div class="sumbar"><span class="t">горит ${n} / ${THREADS.length}</span><span class="chips">${
    Object.values(PILLARS).map(p=>`<span style="color:${p.c}"><img src="${p.icon}">${p.val}</span>`).join('')
  }</span></div>`;
}
const tierGem = t => `<span class="gem" style="background:${t.tier===3?'linear-gradient(140deg,#c792ff,#7a4fd0)':(t.tier===2?'linear-gradient(140deg,#ffd98a,#e8b04b)':'linear-gradient(140deg,#cfd6e4,#8b93a5)')};box-shadow:0 0 8px ${t.tier===3?'rgba(199,146,255,.7)':(t.tier===2?'rgba(232,176,75,.7)':'rgba(255,255,255,.25)')}"></span>`;
const statusDot = t => `<span class="dot" style="background:${t.on?'var(--gold-hi)':(t.soon?'#3a3348':'#4a4358')};box-shadow:${t.on?'0 0 10px rgba(255,217,138,.9)':'none'}"></span>`;

/* общие точки столпов на окружности */
const C = { x:170, y:153, R:118 };
const PPOS = { fortitude:[170,44], might:[288,153], finesse:[170,262], instinct:[52,153] };

/* хорда между двумя столпами: квадрат. кривая с глубиной t */
function chordPath(a,b,t){
  const [x1,y1]=PPOS[a],[x2,y2]=PPOS[b];
  const mx=(x1+x2)/2, my=(y1+y2)/2;
  const cx=mx+(C.x-mx)*t, cy=my+(C.y-my)*t;
  return { d:`M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`, apex:[0.25*x1+0.5*cx+0.25*x2, 0.25*y1+0.5*cy+0.25*y2] };
}
/* глубина хорды: индекс внутри пары, чтобы параллельные нити не слипались */
function depths(list){
  const seen={};
  return list.map(t=>{
    const key=[t.a,t.b].sort().join('-');
    const k=seen[key]=(seen[key]??0);
    seen[key]++;
    return 0.42 + k*0.22;
  });
}
function pillarStars(scale=1, label=true){
  let s='';
  const lbl={fortitude:[0,-30],might:[0,-30],finesse:[0,38],instinct:[0,-30]};
  for(const [k,p] of Object.entries(PILLARS)){
    const [x,y]=PPOS[k];
    s+=`<g transform="translate(${x},${y})">
      <circle r="${24*scale}" fill="${p.c}" opacity=".08"/>
      <circle r="${24*scale}" fill="none" stroke="${p.c}" stroke-width="1" opacity=".4"/>
      <circle r="${17*scale}" fill="#171122" stroke="${p.c}" stroke-width="1.3"/>
      <image x="${-10*scale}" y="${-10*scale}" width="${20*scale}" height="${20*scale}" href="${p.icon}"/>
      ${label?`<text x="${lbl[k][0]}" y="${lbl[k][1]}" text-anchor="middle" fill="${p.c}" class="svg-mono" font-size="9" letter-spacing="1">${p.short} ${p.val}</text>`:''}
    </g>`;
  }
  return s;
}
const starDust = (w,h,n=24) => [...Array(n)].map((_,i)=>`<circle cx="${(i*67+13)%w}" cy="${(i*113+29)%h}" r="${i%3?0.7:1.2}" fill="#fff" opacity="${0.05+(i%4)*0.04}"/>`).join('');
const defs = `<defs>
  <filter id="bl" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
  <linearGradient id="gld" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8b04b"/><stop offset="1" stop-color="#ffd98a"/></linearGradient>
</defs>`;

function detailCard(t, opts={}){
  return `<div class="card" style="margin-top:8px;padding:11px;${t.on?'border-color:var(--edge);box-shadow:0 0 26px rgba(232,176,75,.16);':''}">
    <div style="display:flex;align-items:center;gap:8px;min-width:0">
      <img src="${t.icon}" style="width:22px;height:22px;flex:none;${t.on||t.soon?'':'opacity:.6'}">
      <b style="flex:1;min-width:0;font-family:var(--disp);font-size:14px;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.ru}</b>
      ${tierGem(t)}
      <span style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:${t.on?'var(--gold-hi)':(t.soon?'#c792ff':'var(--dim)')};text-transform:uppercase">${statusDot(t)}${t.on?'горит':(t.soon?'скоро':'спит')}</span>
    </div>
    <p style="margin:7px 0 0;font-size:12px;color:var(--muted);line-height:1.5">${t.fx}</p>
    ${opts.showMissing && !t.on && !t.soon ? `<p style="margin-top:6px;font-family:var(--mono);font-size:9.5px;color:#ff9d85">не хватает: ${missing(t)}</p>` : ''}
    <div style="display:flex;gap:12px;margin-top:8px">
      <span style="font-family:var(--mono);font-size:9.5px;color:${PILLARS[t.a].c}">${PILLARS[t.a].ru.toUpperCase()} ${PILLARS[t.a].val}/${t.an}</span>
      <span style="font-family:var(--mono);font-size:9.5px;color:${PILLARS[t.b].c}">${PILLARS[t.b].ru.toUpperCase()} ${PILLARS[t.b].val}/${t.bn}</span>
    </div>
  </div>`;
}

/* ═══ A1 · АККОРД-НЕБО: хорды-ленты между столпами, фильтр по столпу ═══ */
function variantA1(){
  const list = THREADS;
  const dep = depths(list);
  const filterP = 'fortitude'; // демо: фильтр включён на Стойкость
  let glow='', lines='', knots='';
  list.forEach((t,i)=>{
    const { d, apex } = chordPath(t.a, t.b, dep[i]);
    const dim = !(t.a===filterP || t.b===filterP);
    const col = t.on ? 'url(#gld)' : (t.soon ? '#5b4a7a' : '#3a3348');
    const op = dim ? 0.16 : (t.on ? 1 : 0.75);
    if(t.on && !dim) glow += `<path d="${d}" fill="none" stroke="#ffd98a" stroke-width="6" opacity=".25" filter="url(#bl)"/>`;
    lines += `<path d="${d}" fill="none" stroke="${col}" stroke-width="${t.on?1.8:1.2}" stroke-linecap="round" stroke-dasharray="${t.on?'':(t.soon?'2 6':'3 7')}" opacity="${op}"/>`;
    if(!dim) knots += `<g transform="translate(${apex[0]},${apex[1]})" opacity="${t.soon?0.55:1}">
      <circle r="13" fill="#171122" stroke="${t.on?'var(--gold)':(t.soon?'#5b4a7a':'#3a3348')}" stroke-width="1"/>
      <image x="-8" y="-8" width="16" height="16" href="${t.icon}" opacity="${t.on?1:.5}"/></g>`;
  });
  return chrome(`${sumbar()}
    <div class="fchips">
      ${Object.entries(PILLARS).map(([k,p])=>`<button class="${k===filterP?'on':''}" style="${k===filterP?`color:${p.c};border-color:${p.c}`:''}"><img src="${p.icon}">${p.short}</button>`).join('')}
    </div>
    <svg viewBox="0 0 340 318" width="100%" style="display:block">
      ${defs}${starDust(340,318)}${glow}${lines}${knots}${pillarStars(1,true)}
    </svg>
    ${detailCard(THREADS[0])}`, 'нити · аккорд-небо');
}

/* ═══ A2 · НЕБЕСА-СТРАНИЦЫ: пейджер созвездий по ярусам ═══ */
function variantA2(){
  const pages=[
    {name:'НЕБО I · НИТИ',   test:t=>t.tier===1},
    {name:'НЕБО II · ВЫСШИЕ',test:t=>t.tier===2},
    {name:'НЕБО III · СКОРО',test:t=>t.soon===true},
  ];
  const page=0;
  const list=THREADS.filter(pages[page].test);
  const dep=depths(list);
  let glow='',lines='',knots='';
  list.forEach((t,i)=>{
    const {d,apex}=chordPath(t.a,t.b,dep[i]);
    if(t.on) glow+=`<path d="${d}" fill="none" stroke="#ffd98a" stroke-width="6" opacity=".25" filter="url(#bl)"/>`;
    lines+=`<path d="${d}" fill="none" stroke="${t.on?'url(#gld)':'#3a3348'}" stroke-width="${t.on?2:1.3}" stroke-linecap="round" stroke-dasharray="${t.on?'':'3 7'}"/>`;
    knots+=`<g transform="translate(${apex[0]},${apex[1]})">
      <circle r="15" fill="#171122" stroke="${t.on?'var(--gold)':'#3a3348'}" stroke-width="1.1"/>
      <image x="-9" y="-9" width="18" height="18" href="${t.icon}" opacity="${t.on?1:.55}"/></g>`;
  });
  return chrome(`${sumbar()}
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:9px">
      <span style="flex:1;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--gold-hi);text-transform:uppercase">${pages[page].name}</span>
      <span style="display:flex;gap:5px">${pages.map((_,i)=>`<span style="width:${i===page?16:6}px;height:6px;border-radius:999px;background:${i===page?'var(--gold-hi)':'#3a3348'};box-shadow:${i===page?'0 0 8px rgba(255,217,138,.8)':'none'}"></span>`).join('')}</span>
    </div>
    <svg viewBox="0 0 340 318" width="100%" style="display:block">
      ${defs}${starDust(340,318)}${glow}${lines}${knots}${pillarStars(1,true)}
    </svg>
    <div style="display:flex;gap:6px;margin-top:8px">
      ${pages.map((p,i)=>`<span class="card" style="flex:1;text-align:center;padding:6px 4px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:${i===page?'var(--gold-hi)':'var(--dim)'};${i===page?'border-color:var(--edge);':''}">${p.name.split('·')[0].trim()} · ${THREADS.filter(p.test).length}</span>`).join('')}
    </div>
    ${detailCard(THREADS[0])}`, 'нити · небеса');
}

/* ═══ A3 · ЗВЁЗДНАЯ ЛЕНТА: сигил K4 в шапке + feed строк-нитей ═══ */
function variantA3(){
  const sigil = `<svg viewBox="0 0 64 64" width="56" height="56" style="flex:none">
    ${defs}
    ${[['fortitude','might'],['might','finesse'],['finesse','instinct'],['instinct','fortitude'],['fortitude','finesse'],['might','instinct']].map(([a,b],i)=>{
      const pa={fortitude:[32,8],might:[56,32],finesse:[32,56],instinct:[8,32]};
      const on=i<2;
      return `<line x1="${pa[a][0]}" y1="${pa[a][1]}" x2="${pa[b][0]}" y2="${pa[b][1]}" stroke="${on?'#ffd98a':'#3a3348'}" stroke-width="${on?1.4:0.9}" stroke-dasharray="${on?'':'2 3'}"/>`;
    }).join('')}
    ${Object.entries({fortitude:[32,8],might:[56,32],finesse:[32,56],instinct:[8,32]}).map(([k,xy])=>`<circle cx="${xy[0]}" cy="${xy[1]}" r="4.5" fill="#171122" stroke="${PILLARS[k].c}" stroke-width="1.1"/>`).join('')}
  </svg>`;
  const rows = THREADS.map(t=>{
    const pa=PILLARS[t.a], pb=PILLARS[t.b];
    return `<div class="card" style="padding:9px 10px;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;${t.on?'border-color:var(--edge);background:rgba(232,176,75,.06);':''}">
      <svg viewBox="0 0 52 30" width="52" height="30" style="flex:none">
        ${t.on?`<line x1="7" y1="15" x2="45" y2="15" stroke="#ffd98a" stroke-width="4" opacity=".25" filter="url(#bl)"/>`:''}
        <line x1="7" y1="15" x2="45" y2="15" stroke="${t.on?'url(#gld)':(t.soon?'#5b4a7a':'#3a3348')}" stroke-width="${t.on?1.6:1.1}" stroke-dasharray="${t.on?'':'2 4'}"/>
        <circle cx="7" cy="15" r="5" fill="#171122" stroke="${pa.c}" stroke-width="1.1"/>
        <circle cx="45" cy="15" r="5" fill="#171122" stroke="${pb.c}" stroke-width="1.1"/>
        <circle cx="26" cy="15" r="7.5" fill="#171122" stroke="${t.on?'var(--gold)':(t.soon?'#5b4a7a':'#3a3348')}" stroke-width="1"/>
        <image x="20" y="9" width="12" height="12" href="${t.icon}" opacity="${t.on?1:.5}"/>
      </svg>
      <span style="min-width:0;display:grid;gap:5px">
        <span style="display:flex;align-items:center;gap:7px;min-width:0">
          <b style="flex:1;min-width:0;font-family:var(--disp);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.ru}</b>
          ${t.tier>1?tierGem(t):''}
        </span>
        <span style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center">
          <span class="bar"><i class="${t.on?'':'lack'}" style="width:${Math.min(100, Math.min(PILLARS[t.a].val/t.an, PILLARS[t.b].val/t.bn)*100)}%"></i></span>
          <span style="font-family:var(--mono);font-size:9px;color:${t.on?'var(--gold-hi)':(t.soon?'#c792ff':'var(--dim)')}">${t.on?'готова':(t.soon?'скоро':`${Math.min(PILLARS[t.a].val/t.an,PILLARS[t.b].val/t.bn)*100|0}%`)}</span>
        </span>
      </span>
      ${statusDot(t)}
    </div>`;
  }).join('');
  return chrome(`
    <div class="sumbar" style="align-items:center">
      <span style="display:flex;align-items:center;gap:9px;min-width:0">${sigil}
        <span style="min-width:0"><span class="t" style="display:block">гобелен судьбы</span>
        <span style="font-family:var(--mono);font-size:9px;color:var(--dim)">6 нитей · 4 скоро · K4</span></span>
      </span>
      <span class="t">✦ ${THREADS.filter(t=>t.on).length} / ${THREADS.length}</span>
    </div>
    <div style="display:grid;gap:7px">${rows}</div>`, 'нити · звёздная лента');
}

/* ═══ A4 · АККОРД + ЛЕНТА: обзор-хорды сверху, рабочий список снизу ═══ */
function variantA4(){
  const dep=depths(THREADS);
  let glow='',lines='',knots='';
  THREADS.forEach((t,i)=>{
    const {d,apex}=chordPath(t.a,t.b,dep[i]);
    if(t.on) glow+=`<path d="${d}" fill="none" stroke="#ffd98a" stroke-width="5" opacity=".25" filter="url(#bl)"/>`;
    lines+=`<path d="${d}" fill="none" stroke="${t.on?'url(#gld)':(t.soon?'#5b4a7a':'#3a3348')}" stroke-width="${t.on?1.6:1}" stroke-linecap="round" stroke-dasharray="${t.on?'':(t.soon?'2 5':'3 6')}" opacity="${t.on?1:.8}"/>`;
    knots+=`<circle cx="${apex[0]}" cy="${apex[1]}" r="${t.on?4:2.6}" fill="${t.on?'#ffd98a':(t.soon?'#5b4a7a':'#4a4358')}" ${t.on?'filter="url(#bl)"':''}/>`;
  });
  const sel=THREADS[4];
  const rows=THREADS.slice(0,6).map(t=>`
    <div class="card" style="padding:7px 9px;display:flex;align-items:center;gap:8px;min-width:0;${t.id===sel.id?'border-color:var(--edge);background:rgba(232,176,75,.08);box-shadow:0 0 16px rgba(232,176,75,.18);':''}">
      <img src="${t.icon}" style="width:18px;height:18px;flex:none;${t.on?'':'opacity:.55'}">
      <b style="flex:1;min-width:0;font-family:var(--disp);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.ru}</b>
      ${t.tier>1?tierGem(t):''}${statusDot(t)}
    </div>`).join('');
  return chrome(`${sumbar()}
    <svg viewBox="0 0 340 300" width="100%" style="display:block;max-height:230px">
      ${defs}${starDust(340,300,18)}${glow}${lines}${knots}${pillarStars(0.85,false)}
    </svg>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;margin-top:6px">${rows}</div>
    ${detailCard(sel,{showMissing:true})}`, 'нити · аккорд + лента');
}

const VARIANTS=[
  ['A1','Аккорд-небо','Хорды-ленты между столпами на фиксированном кадре: без pan/zoom (главное отличие от «Тела»). Параллельные нити одной пары разводятся по глубине, фильтр по столпу гасит лишнее. Держит десятки нитей.','масштаб: хорды + фильтр · отличие: нет pan/zoom'],
  ['A2','Небеса-страницы','Пейджер созвездий по ярусам: Небо I (нити), Небо II (высшие), Небо III (скоро). На каждом небе — только свои нити, поэтому карта никогда не перегружена; новые нити = новые небеса.','масштаб: страницы · отличие: дискретные плиты'],
  ['A3','Звёздная лента','Сигил K4 в шапке как фирменный знак + вертикальный feed строк-нитей: мини-хорда с двумя звёздами столпов и узелком, полоса готовности, точка статуса. Масштаб бесконечный.','масштаб: лента · отличие: feed, не полотно'],
  ['A4','Аккорд + лента','Обзор-хорды сверху (только свет и узлы, без подписей) + рабочий список снизу с синхронным выбором. Обзорность карты плюс читаемость списка.','масштаб: список · отличие: карта без интерактива'],
];
const builders=[variantA1,variantA2,variantA3,variantA4];
document.getElementById('root').innerHTML = VARIANTS.map(([letter,name,desc,trade],i)=>`
  <div class="vwrap">
    <div class="sheet-label"><h2>${letter} — ${name}</h2><p>${desc}</p><span class="tag">${trade}</span></div>
    <div class="phone" id="variant-${letter}">${builders[i]()}</div>
  </div>`).join('');
</script>
</body>
</html>
